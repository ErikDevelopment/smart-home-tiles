<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --fg:#ffffff;
    --muted:#a0a4aa;
    --accent:#4da3ff;
    --warn:#f5c542;
    --error:#ff6b6b;
    --ok:#57d38c;
  }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent; overflow:hidden;
  }
  body{
    background:transparent;
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    display:flex; justify-content:center; align-items:center;
  }
  .tile{
    width:340px;
    padding:20px 22px;
    box-sizing:border-box;
    border-radius:22px;
    background:transparent;
  }
  .head{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em;
    margin-bottom:14px;
  }
  .head i{ font-size:13px; color:var(--accent); }

  .row{
    padding:9px 0;
    border-top:1px solid rgba(255,255,255,0.07);
  }
  .row:first-of-type{ border-top:none; padding-top:0; }

  .row-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .row-label{
    display:flex; align-items:center; gap:7px;
    font-size:12.5px;
    color:var(--muted);
  }
  .row-label i{ width:14px; text-align:center; color:var(--accent); font-size:12px; }
  .row-val{
    font-size:16px;
    font-weight:500;
  }
  .row-sub{
    margin-top:3px;
    font-size:11px;
    color:var(--muted);
  }

  .bar-track{
    margin-top:7px;
    height:4px;
    border-radius:2px;
    background:rgba(255,255,255,0.1);
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:2px;
    width:0%;
    transition:width .5s ease, background .3s ease;
  }

  .net-line{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--muted);
    margin-top:3px;
  }
  .net-line .dot{
    width:7px; height:7px; border-radius:50%;
    background:#5b6472;
    flex-shrink:0;
  }
  .net-line .dot.on{ background:var(--ok); }
  .net-line .dot.off{ background:var(--error); }
  .net-line .ip{ margin-left:auto; font-variant-numeric:tabular-nums; }
  .net-line.active{ color:var(--fg); }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    padding:3px 9px;
    border-radius:10px;
  }
  .badge.ok{
    color:var(--ok);
    background:rgba(87,211,140,0.14);
    border:1px solid rgba(87,211,140,0.4);
  }
  .badge.warn{
    color:var(--error);
    background:rgba(255,107,107,0.14);
    border:1px solid rgba(255,107,107,0.4);
  }
</style>
</head>
<body>
<main class="tile">
  <div class="head"><i class="fa-solid fa-server"></i> Systemstatus</div>

  <div class="row">
    <div class="row-top">
      <span class="row-label"><i class="fa-solid fa-microchip"></i> CPU</span>
      <span class="row-val" id="cpuTempVal">–</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="cpuBar"></div></div>
    <div class="row-sub" id="cpuSub">–</div>
  </div>

  <div class="row">
    <div class="row-top">
      <span class="row-label"><i class="fa-solid fa-memory"></i> RAM</span>
      <span class="row-val" id="ramVal">–</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="ramBar"></div></div>
    <div class="row-sub" id="ramSub">–</div>
  </div>

  <div class="row">
    <div class="row-top">
      <span class="row-label"><i class="fa-solid fa-hard-drive"></i> Speicher</span>
      <span class="row-val" id="diskVal">–</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="diskBar"></div></div>
    <div class="row-sub" id="diskSub">–</div>
  </div>

  <div class="row">
    <div class="row-top">
      <span class="row-label"><i class="fa-solid fa-network-wired"></i> Netzwerk</span>
      <span class="row-val" id="netVal">–</span>
    </div>
    <div class="net-line" id="lanLine">
      <span class="dot" id="lanDot"></span><span>LAN</span><span class="ip" id="lanIp">–</span>
    </div>
    <div class="net-line" id="wlanLine">
      <span class="dot" id="wlanDot"></span><span>WLAN</span><span class="ip" id="wlanIp">–</span>
    </div>
  </div>

  <div class="row">
    <div class="row-top">
      <span class="row-label"><i class="fa-solid fa-clock-rotate-left"></i> Laufzeit</span>
      <span class="row-val" id="uptimeVal">–</span>
    </div>
    <div class="row-sub"><span class="badge" id="throttleBadge">–</span></div>
  </div>
</main>

<script>
/* URL-Parameter (alles optional, ohne Parameter laufen Dummy-Daten):
   ?temp=&load1=&load5=&load15=
   &ramFree=&ramFreePercent=&ramTotal=
   &diskFree=&diskFreePercent=&diskTotal=
   &active=&ipLan=&ipWlan=&lan=&wlan=
   &uptime=&throttled=
   (free/total-Werte in GB) */
const p = new URLSearchParams(location.search);

function num(val, def){
  if (val === null || val === undefined || val === "") return def;
  const n = Number(String(val).replace(",", "."));
  return Number.isNaN(n) ? def : n;
}
function str(val, def){
  if (!val || typeof val !== "string") return def;
  return val.trim() || def;
}
function bool(val, def){
  if (val === null || val === undefined || val === "") return def;
  return String(val).toLowerCase() === "true";
}

/* ---- CPU ---- */
const temp = num(p.get("temp"), 63.7);
const load1 = num(p.get("load1"), 0.15);
const load5 = num(p.get("load5"), 0.06);
const load15 = num(p.get("load15"), 0.06);

function tempColor(t){
  if (t === null) return "var(--muted)";
  if (t < 60) return "var(--ok)";
  if (t < 75) return "var(--warn)";
  return "var(--error)";
}
const cpuColor = tempColor(temp);
document.getElementById("cpuTempVal").textContent = (temp !== null ? temp.toFixed(1) : "–") + "°C";
document.getElementById("cpuTempVal").style.color = cpuColor;
document.getElementById("cpuBar").style.width = (temp !== null ? Math.max(0, Math.min(100, (temp / 85) * 100)) : 0) + "%";
document.getElementById("cpuBar").style.background = cpuColor;
document.getElementById("cpuSub").textContent =
  "Last " + load1.toFixed(2) + " · " + load5.toFixed(2) + " · " + load15.toFixed(2) + " (1/5/15 Min)";

/* ---- RAM ---- */
const ramFree = num(p.get("ramFree"), 1.2);
const ramFreePct = num(p.get("ramFreePercent"), 28);
const ramTotal = num(p.get("ramTotal"), 4);

function usageColor(usedPct){
  if (usedPct === null) return "var(--muted)";
  if (usedPct < 70) return "var(--ok)";
  if (usedPct < 88) return "var(--warn)";
  return "var(--error)";
}
const ramUsedPct = ramFreePct !== null ? 100 - ramFreePct : null;
const ramColor = usageColor(ramUsedPct);
document.getElementById("ramVal").textContent = (ramFreePct !== null ? ramFreePct.toFixed(0) : "–") + "% frei";
document.getElementById("ramVal").style.color = ramColor;
document.getElementById("ramBar").style.width = (ramUsedPct !== null ? Math.max(0, Math.min(100, ramUsedPct)) : 0) + "%";
document.getElementById("ramBar").style.background = ramColor;
document.getElementById("ramSub").textContent =
  (ramFree !== null ? ramFree.toFixed(1) : "–") + " GB frei von " + (ramTotal !== null ? ramTotal.toFixed(1) : "–") + " GB";

/* ---- Disk ---- */
const diskFree = num(p.get("diskFree"), 24);
const diskFreePct = num(p.get("diskFreePercent"), 41);
const diskTotal = num(p.get("diskTotal"), 58);

const diskUsedPct = diskFreePct !== null ? 100 - diskFreePct : null;
const diskColor = usageColor(diskUsedPct);
document.getElementById("diskVal").textContent = (diskFreePct !== null ? diskFreePct.toFixed(0) : "–") + "% frei";
document.getElementById("diskVal").style.color = diskColor;
document.getElementById("diskBar").style.width = (diskUsedPct !== null ? Math.max(0, Math.min(100, diskUsedPct)) : 0) + "%";
document.getElementById("diskBar").style.background = diskColor;
document.getElementById("diskSub").textContent =
  (diskFree !== null ? diskFree.toFixed(0) : "–") + " GB frei von " + (diskTotal !== null ? diskTotal.toFixed(0) : "–") + " GB";

/* ---- Netzwerk ---- */
const active = str(p.get("active"), "LAN");
const ipLan  = str(p.get("ipLan"), "192.168.178.138");
const ipWlan = str(p.get("ipWlan"), "192.168.178.131");
const lanOk  = bool(p.get("lan"), true);
const wlanOk = bool(p.get("wlan"), true);

document.getElementById("netVal").textContent = active;

function setNetLine(lineId, dotId, ipId, ok, ip, isActive){
  const dot = document.getElementById(dotId);
  dot.className = "dot " + (ok ? "on" : "off");
  document.getElementById(ipId).textContent = ip || "–";
  if (isActive) document.getElementById(lineId).classList.add("active");
}
setNetLine("lanLine", "lanDot", "lanIp", lanOk, ipLan, active.toUpperCase() === "LAN");
setNetLine("wlanLine", "wlanDot", "wlanIp", wlanOk, ipWlan, active.toUpperCase() === "WLAN");

/* ---- Laufzeit / Throttled ---- */
const uptimeSec = num(p.get("uptime"), 191736);
const throttled = bool(p.get("throttled"), false);

function fmtUptime(sec){
  if (sec === null) return "–";
  const days = Math.floor(sec / 86400);
  const hours = Math.floor((sec % 86400) / 3600);
  const mins = Math.floor((sec % 3600) / 60);
  if (days > 0) return `${days} Tage, ${hours} Std`;
  if (hours > 0) return `${hours} Std, ${mins} Min`;
  return `${mins} Min`;
}
document.getElementById("uptimeVal").textContent = fmtUptime(uptimeSec);

const badge = document.getElementById("throttleBadge");
if (throttled) {
  badge.className = "badge warn";
  badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Gedrosselt (Spannung/Hitze prüfen)';
} else {
  badge.className = "badge ok";
  badge.innerHTML = '<i class="fa-solid fa-circle-check"></i> Normal';
}
</script>
</body>
</html>
