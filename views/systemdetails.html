<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --fg:#ffffff;
    --muted:#a0a4aa;
    --accent:#4da3ff;
    --warn:#f5c542;
    --error:#ff6b6b;
    --ok:#57d38c;
  }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent; overflow:hidden;
  }
  body{
    background:transparent;
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    display:flex; justify-content:center; align-items:flex-start;
  }
  .tile{
    width:360px;
    padding:20px 22px;
    box-sizing:border-box;
    border-radius:22px;
    background:transparent;
  }
  .head{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em;
    margin-bottom:6px;
  }
  .head i{ font-size:13px; color:var(--accent); }

  .host-block{ margin-top:14px; }
  .host-title{
    display:flex; align-items:center; gap:7px;
    font-size:12.5px; font-weight:600;
    color:var(--fg);
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,0.09);
  }
  .host-title i{ font-size:12px; color:var(--accent); }

  .mrow{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    font-size:12.5px;
  }
  .mrow .mlabel{ color:var(--muted); display:flex; align-items:center; gap:6px; }
  .mrow .mlabel i{ width:12px; text-align:center; font-size:11px; color:var(--accent); }
  .mrow .mval{ font-weight:500; font-size:13.5px; }
  .mrow .msub{ color:var(--muted); font-size:11px; margin-left:6px; font-weight:400; }

  .bar-track{
    height:3px;
    border-radius:2px;
    background:rgba(255,255,255,0.1);
    overflow:hidden;
    margin-top:-2px;
    margin-bottom:4px;
  }
  .bar-fill{
    height:100%;
    border-radius:2px;
    width:0%;
  }

  .warn-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    padding:3px 9px;
    border-radius:10px;
    color:var(--error);
    background:rgba(255,107,107,0.14);
    border:1px solid rgba(255,107,107,0.4);
    margin-top:4px;
  }

  .no-data{
    font-size:11.5px;
    color:var(--muted);
    padding:6px 0;
  }
</style>
</head>
<body>
<main class="tile">
  <div class="head"><i class="fa-solid fa-server"></i> System – Master &amp; Slave</div>
  <div id="hosts"></div>
</main>

<script>
/* URL-Parameter (Prefix m = Master, s = Slave), alles optional:
   ?mName=&mTemp=&mLoad1=&mRamFree=&mRamFreePercent=&mRamTotal=
   &mDiskFree=&mDiskFreePercent=&mDiskTotal=&mActive=&mIpLan=&mIpWlan=&mUptime=&mThrottled=
   (dieselben Parameter nochmal mit Prefix "s" fuer den Slave)

   Wird die Seite OHNE jegliche Parameter geoeffnet (reine Vorschau),
   laufen auf beiden Bloecken Dummy-Daten. Sobald mindestens ein
   Parameter da ist (echter Betrieb), wird ein fehlender/leerer
   Einzelwert nicht mit einem Dummy aufgefuellt, sondern die Zeile
   einfach ausgeblendet (z.B. Temperatur auf einem Host ohne Sensor). */

const params = new URLSearchParams(location.search);
const live = params.toString().length > 0;

function num(key, dummy){
  const raw = params.get(key);
  if (raw === null || raw === "") return live ? null : dummy;
  const n = Number(String(raw).replace(",", "."));
  return Number.isNaN(n) ? (live ? null : dummy) : n;
}
function str(key, dummy){
  const raw = params.get(key);
  if (!raw) return live ? null : dummy;
  return raw;
}
function bool(key, dummy){
  const raw = params.get(key);
  if (raw === null || raw === "") return live ? null : dummy;
  return String(raw).toLowerCase() === "true";
}

function usageColor(usedPct){
  if (usedPct === null) return "var(--muted)";
  if (usedPct < 70) return "var(--ok)";
  if (usedPct < 88) return "var(--warn)";
  return "var(--error)";
}
function tempColor(t){
  if (t === null) return "var(--muted)";
  if (t < 60) return "var(--ok)";
  if (t < 75) return "var(--warn)";
  return "var(--error)";
}
function fmtUptime(sec){
  if (sec === null) return null;
  const days = Math.floor(sec / 86400);
  const hours = Math.floor((sec % 86400) / 3600);
  const mins = Math.floor((sec % 3600) / 60);
  if (days > 0) return `${days} Tage, ${hours} Std`;
  if (hours > 0) return `${hours} Std, ${mins} Min`;
  return `${mins} Min`;
}

function buildHostBlock(prefix, dummy){
  const name       = str(prefix + "Name", dummy.name);
  const temp       = num(prefix + "Temp", dummy.temp);
  const load1      = num(prefix + "Load1", dummy.load1);
  const ramFree    = num(prefix + "RamFree", dummy.ramFree);
  const ramFreePct = num(prefix + "RamFreePercent", dummy.ramFreePercent);
  const ramTotal   = num(prefix + "RamTotal", dummy.ramTotal);
  const diskFree   = num(prefix + "DiskFree", dummy.diskFree);
  const diskFreePct= num(prefix + "DiskFreePercent", dummy.diskFreePercent);
  const diskTotal  = num(prefix + "DiskTotal", dummy.diskTotal);
  const active     = str(prefix + "Active", dummy.active);
  const ipLan      = str(prefix + "IpLan", dummy.ipLan);
  const ipWlan     = str(prefix + "IpWlan", dummy.ipWlan);
  const uptime     = num(prefix + "Uptime", dummy.uptime);
  const throttled  = bool(prefix + "Throttled", dummy.throttled);

  let html = `<div class="host-block">`;
  html += `<div class="host-title"><i class="fa-solid fa-microchip"></i> ${name || "Host"}</div>`;

  let anyRow = false;

  if (temp !== null || load1 !== null) {
    anyRow = true;
    const color = temp !== null ? tempColor(temp) : "var(--muted)";
    const valText = temp !== null ? temp.toFixed(1) + "°C" : "–";
    html += `<div class="mrow"><span class="mlabel"><i class="fa-solid fa-temperature-half"></i> CPU</span>
      <span class="mval" style="color:${color}">${valText}${load1 !== null ? `<span class="msub">Last ${load1.toFixed(2)}</span>` : ""}</span></div>`;
    if (temp !== null) {
      const pct = Math.max(0, Math.min(100, (temp / 85) * 100));
      html += `<div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>`;
    }
  }

  if (ramFreePct !== null) {
    anyRow = true;
    const usedPct = 100 - ramFreePct;
    const color = usageColor(usedPct);
    html += `<div class="mrow"><span class="mlabel"><i class="fa-solid fa-memory"></i> RAM</span>
      <span class="mval" style="color:${color}">${ramFreePct.toFixed(0)}% frei${(ramFree !== null && ramTotal !== null) ? `<span class="msub">${(ramFree/1024).toFixed(1)}/${(ramTotal/1024).toFixed(1)} GB</span>` : ""}</span></div>`;
    html += `<div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,Math.min(100,usedPct))}%;background:${color}"></div></div>`;
  }

  if (diskFreePct !== null) {
    anyRow = true;
    const usedPct = 100 - diskFreePct;
    const color = usageColor(usedPct);
    html += `<div class="mrow"><span class="mlabel"><i class="fa-solid fa-hard-drive"></i> Speicher</span>
      <span class="mval" style="color:${color}">${diskFreePct.toFixed(0)}% frei${(diskFree !== null && diskTotal !== null) ? `<span class="msub">${diskFree}/${diskTotal} GB</span>` : ""}</span></div>`;
    html += `<div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,Math.min(100,usedPct))}%;background:${color}"></div></div>`;
  }

  if (active !== null) {
    anyRow = true;
    const ip = active === "WLAN" ? ipWlan : ipLan;
    html += `<div class="mrow"><span class="mlabel"><i class="fa-solid fa-network-wired"></i> Netzwerk</span>
      <span class="mval">${active}${ip ? `<span class="msub">${ip}</span>` : ""}</span></div>`;
  }

  const uptimeText = fmtUptime(uptime);
  if (uptimeText !== null) {
    anyRow = true;
    html += `<div class="mrow"><span class="mlabel"><i class="fa-solid fa-clock-rotate-left"></i> Laufzeit</span>
      <span class="mval">${uptimeText}</span></div>`;
  }

  if (throttled === true) {
    anyRow = true;
    html += `<div class="warn-badge"><i class="fa-solid fa-triangle-exclamation"></i> Gedrosselt (Spannung/Hitze prüfen)</div>`;
  }

  if (!anyRow) {
    html += `<div class="no-data">Keine Daten</div>`;
  }

  html += `</div>`;
  return html;
}

const hostsEl = document.getElementById("hosts");
hostsEl.innerHTML =
  buildHostBlock("m", {
    name: "iobroker-master", temp: 63.7, load1: 0.15,
    ramFree: 1229, ramFreePercent: 28, ramTotal: 4096,
    diskFree: 24, diskFreePercent: 41, diskTotal: 58,
    active: "LAN", ipLan: "192.168.178.138", ipWlan: "192.168.178.131",
    uptime: 191736, throttled: false
  }) +
  buildHostBlock("s", {
    name: "iobroker-slave-prod-1", temp: null, load1: 0.08,
    ramFree: 512, ramFreePercent: 25, ramTotal: 2048,
    diskFree: 12, diskFreePercent: 60, diskTotal: 30,
    active: "LAN", ipLan: "192.168.178.140", ipWlan: null,
    uptime: 86400, throttled: false
  });
</script>
</body>
</html>
