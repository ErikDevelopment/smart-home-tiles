<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adapter-Diagnose</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --fg:#ffffff;
    --muted:#a0a4aa;
    --accent:#4da3ff;
    --warn:#f5c542;
    --error:#ff6b6b;
    --ok:#57d38c;
  }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent; overflow:hidden;
  }
  body{
    background:transparent;
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    display:flex; justify-content:center; align-items:center;
  }
  .tile{
    width:320px;
    padding:20px 22px;
    box-sizing:border-box;
    border-radius:22px;
    background:transparent;
  }
  .head{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em;
    margin-bottom:14px;
  }
  .head i{ font-size:13px; color:var(--accent); }

  .row{
    padding:10px 0;
    border-top:1px solid rgba(255,255,255,0.07);
  }
  .row:first-of-type{ border-top:none; padding-top:0; }

  .row-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .row-label{
    display:flex; align-items:center; gap:7px;
    font-size:12.5px;
    color:var(--muted);
  }
  .row-label i{ width:14px; text-align:center; color:var(--accent); font-size:12px; }
  .row-val{
    font-size:18px;
    font-weight:500;
  }

  .chips{
    margin-top:9px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    padding:4px 9px;
    border-radius:10px;
    background:rgba(255,255,255,0.06);
    color:var(--muted);
  }
  .chip .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--ok);
    flex-shrink:0;
  }
  .chip.down .dot{ background:var(--error); }
  .chip.down{ color:var(--error); }

  .all-ok{
    margin-top:9px;
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--ok);
  }
</style>
</head>
<body>
<main class="tile">
  <div class="head"><i class="fa-solid fa-diagram-project"></i> Adapter-Diagnose</div>

  <div class="row">
    <div class="row-top">
      <span class="row-label"><i class="fa-solid fa-server"></i> Hosts</span>
      <span class="row-val" id="hostsVal">–</span>
    </div>
    <div class="chips" id="hostChips"></div>
  </div>

  <div class="row">
    <div class="row-top">
      <span class="row-label"><i class="fa-solid fa-plug"></i> Adapter</span>
      <span class="row-val" id="adaptersVal">–</span>
    </div>
    <div id="adapterDownWrap"></div>
  </div>
</main>

<script>
/* URL-Parameter (alles optional, ohne Parameter laufen Dummy-Daten):
   ?hostsTotal=&hostsOnline=&hostsDown=Master,Slave  (Namen der Hosts, die NICHT online sind)
   &hostsAll=Master,Slave  (alle Host-Namen, fuer die Chip-Anzeige)
   &adaptersTotal=&adaptersOnline=&adaptersDown=hm-rpc.0,ping.1  (adapter.instanz Namen, die NICHT laufen) */
const p = new URLSearchParams(location.search);

function num(val, def){
  if (val === null || val === undefined || val === "") return def;
  const n = Number(val);
  return Number.isNaN(n) ? def : n;
}
function list(val, def){
  if (val === null || val === undefined || val === "") return def;
  return val.split(",").map(s => s.trim()).filter(Boolean);
}

const hostsTotal   = num(p.get("hostsTotal"), 2);
const hostsOnline  = num(p.get("hostsOnline"), 2);
const hostsAll     = list(p.get("hostsAll"), ["Master", "Slave"]);
const hostsDown    = list(p.get("hostsDown"), []);

const adaptersTotal  = num(p.get("adaptersTotal"), 19);
const adaptersOnline = num(p.get("adaptersOnline"), 18);
const adaptersDown   = list(p.get("adaptersDown"), ["hm-rpc.0"]);

function statusColor(online, total){
  if (total === null || online === null) return "var(--muted)";
  if (online >= total) return "var(--ok)";
  if (online >= total - 1) return "var(--warn)";
  return "var(--error)";
}

/* ---- Hosts ---- */
const hostsColor = statusColor(hostsOnline, hostsTotal);
document.getElementById("hostsVal").textContent =
  (hostsOnline !== null ? hostsOnline : "–") + " / " + (hostsTotal !== null ? hostsTotal : "–") + " online";
document.getElementById("hostsVal").style.color = hostsColor;

const hostChipsEl = document.getElementById("hostChips");
hostsAll.forEach(name => {
  const isDown = hostsDown.includes(name);
  const chip = document.createElement("span");
  chip.className = "chip" + (isDown ? " down" : "");
  chip.innerHTML = '<span class="dot"></span>' + name;
  hostChipsEl.appendChild(chip);
});

/* ---- Adapter ---- */
const adaptersColor = statusColor(adaptersOnline, adaptersTotal);
document.getElementById("adaptersVal").textContent =
  (adaptersOnline !== null ? adaptersOnline : "–") + " / " + (adaptersTotal !== null ? adaptersTotal : "–") + " online";
document.getElementById("adaptersVal").style.color = adaptersColor;

const downWrap = document.getElementById("adapterDownWrap");
if (adaptersDown.length === 0) {
  downWrap.innerHTML = '<div class="all-ok"><i class="fa-solid fa-circle-check"></i> Alle Adapter laufen</div>';
} else {
  const maxShow = 4;
  const shown = adaptersDown.slice(0, maxShow);
  const rest = adaptersDown.length - shown.length;
  const chipsHtml = shown.map(n => `<span class="chip down"><span class="dot"></span>${n}</span>`).join("");
  const moreHtml = rest > 0 ? `<span class="chip down">+${rest} weitere</span>` : "";
  downWrap.innerHTML = `<div class="chips">${chipsHtml}${moreHtml}</div>`;
}
</script>
</body>
</html>
