<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Sun Path Tile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-bg: #171717;
            --text-primary: #FFFFFF;
            --text-secondary: #9A9A9A;
            --border-color: rgba(255, 255, 255, 0.04);
            
            /* Theme Gradients & Glows (werden per JS gewechselt) */
            --fill-gradient: linear-gradient(90deg, #F6B233, #FFC857, #FFDB7A);
            --fill-glow: rgba(255, 200, 87, 0.4);
            --icon-color: #FFC857;
        }

        /* Themes */
        .theme-day {
            --fill-gradient: linear-gradient(90deg, #F6B233, #FFC857, #FFDB7A);
            --fill-glow: rgba(255, 200, 87, 0.5);
            --icon-color: #FFC857;
        }

        .theme-twilight {
            --fill-gradient: linear-gradient(90deg, #FF8A3D, #FF5E7E, #8E6BFF);
            --fill-glow: rgba(255, 94, 126, 0.5);
            --icon-color: #FF5E7E;
        }

        .theme-night {
            --fill-gradient: linear-gradient(90deg, #23395D, #304B73, #5B6EE1);
            --fill-glow: rgba(91, 110, 225, 0.5);
            --icon-color: #5B6EE1;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .sun-card {
            background-color: var(--card-bg);
            border-radius: 22px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            
            width: min(1400px, 100%);
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            
            /* Initial Animation */
            opacity: 0;
            transform: translateY(15px);
            animation: fadeSlideUp 350ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            transition: all 0.8s ease; /* Weicher Wechsel bei Theme-Änderungen */
        }

        @keyframes fadeSlideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Zeit-Blöcke (Links & Rechts) --- */
        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
            flex-shrink: 0;
            gap: 6px;
        }

        .time-block svg {
            width: 28px;
            height: 28px;
            stroke: var(--icon-color);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.8s ease;
        }

        .time-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .time-value {
            font-size: 22px;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* --- Progress Center --- */
        .progress-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-top: 15px; /* Platz für Marker */
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            /* Zarter Background-Sky-Verlauf im leeren Balken */
            background-image: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: var(--fill-gradient);
            box-shadow: 0 0 14px var(--fill-glow);
            transition: width 1.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.8s ease, background 0.8s ease;
            position: relative;
        }

        .marker {
            position: absolute;
            top: -28px;
            left: 0; /* Wird per JS gesetzt */
            font-size: 20px;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
            transition: left 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: translateX(-50%); /* Zentriert genau auf dem Prozentwert */
            z-index: 2;
        }

        .status-text {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Responsive Anpassungen */
        @media (max-width: 600px) {
            .sun-card {
                flex-direction: column;
                gap: 20px;
                padding: 24px 20px;
                border-radius: 18px;
            }
            .time-block {
                flex-direction: row;
                width: 100%;
                justify-content: space-between;
                min-width: auto;
            }
            .time-block svg { width: 24px; height: 24px; }
            .time-value { font-size: 18px; }
            .progress-section { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="sun-card theme-day" id="sun-card">
        
        <!-- Left Block -->
        <div class="time-block">
            <div id="left-icon"></div>
            <span class="time-label" id="left-label">Aufgang</span>
            <span class="time-value" id="left-time">--:--</span>
        </div>

        <!-- Center Progress -->
        <div class="progress-section">
            <div class="progress-track">
                <div class="marker" id="marker">🌞</div>
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="status-text" id="status-text">Lade Sonnenverlauf...</div>
        </div>

        <!-- Right Block -->
        <div class="time-block">
            <div id="right-icon"></div>
            <span class="time-label" id="right-label">Untergang</span>
            <span class="time-value" id="right-time">--:--</span>
        </div>

    </div>

<script>
    // --- Icons als SVG Strings ---
    const svgs = {
        sunrise: `<svg viewBox="0 0 24 24"><path d="M12 2v2"/><path d="M4.22 10.22l1.42 1.42"/><path d="M18.36 11.64l1.42-1.42"/><path d="M22 22H2"/><path d="M8 6l4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg>`,
        sunset: `<svg viewBox="0 0 24 24"><path d="M12 2v2"/><path d="M4.22 10.22l1.42 1.42"/><path d="M18.36 11.64l1.42-1.42"/><path d="M22 22H2"/><path d="M16 10l-4 4-4-4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg>`,
        moon: `<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`
    };

    // Helfer: HH:mm in Minuten seit Mitternacht umwandeln
    function timeToMins(timeStr) {
        if (!timeStr || !timeStr.includes(':')) return 0;
        const parts = timeStr.split(':');
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        
        // Parameter auslesen (mit Fallbacks für Tests)
        let sunriseStr = params.get('sunrise') || '06:00';
        let sunsetStr = params.get('sunset') || '20:00';
        let nowStr = params.get('now');

        // Falls kein 'now' übergeben wird, verwende die reale Systemzeit
        if (!nowStr) {
            const date = new Date();
            nowStr = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        const sr = timeToMins(sunriseStr);
        const ss = timeToMins(sunsetStr);
        const n = timeToMins(nowStr);

        // State-Logik
        const isDay = (n >= sr && n < ss);
        // Dämmerung: +/- 30 Minuten um Auf- oder Untergang
        const isTwilight = Math.abs(n - sr) <= 30 || Math.abs(n - ss) <= 30;

        // DOM Elemente
        const card = document.getElementById('sun-card');
        const fill = document.getElementById('progress-fill');
        const marker = document.getElementById('marker');
        const statusText = document.getElementById('status-text');
        
        const leftIcon = document.getElementById('left-icon');
        const leftLabel = document.getElementById('left-label');
        const leftTime = document.getElementById('left-time');

        const rightIcon = document.getElementById('right-icon');
        const rightLabel = document.getElementById('right-label');
        const rightTime = document.getElementById('right-time');

        let progress = 0;

        // Theme setzen
        card.className = 'sun-card'; // reset
        if (isTwilight) {
            card.classList.add('theme-twilight');
        } else if (isDay) {
            card.classList.add('theme-day');
        } else {
            card.classList.add('theme-night');
        }

        // Layout & Berechnungen je nach Tag/Nacht
        if (isDay) {
            // Tag-Modus: Balken geht von Sonnenaufgang bis Sonnenuntergang
            progress = ((n - sr) / (ss - sr)) * 100;
            
            leftLabel.textContent = "Sonnenaufgang";
            leftTime.textContent = sunriseStr;
            leftIcon.innerHTML = svgs.sunrise;

            rightLabel.textContent = "Sonnenuntergang";
            rightTime.textContent = sunsetStr;
            rightIcon.innerHTML = svgs.sunset;
            
            marker.textContent = "🌞";
            statusText.textContent = `${Math.round(progress)} % des Tages vergangen`;
            
        } else {
            // Nacht-Modus: Balken geht von Sonnenuntergang bis Sonnenaufgang
            let totalNightMins = (1440 - ss) + sr;
            // Wie viele Minuten sind seit dem letzten Sonnenuntergang vergangen?
            let elapsedNightMins = (n >= ss) ? (n - ss) : ((1440 - ss) + n);
            
            progress = (elapsedNightMins / totalNightMins) * 100;
            
            leftLabel.textContent = "Sonnenuntergang";
            leftTime.textContent = sunsetStr;
            leftIcon.innerHTML = svgs.sunset;

            rightLabel.textContent = "Sonnenaufgang";
            rightTime.textContent = sunriseStr;
            rightIcon.innerHTML = svgs.sunrise;
            
            marker.textContent = "🌙";
            
            // Verbleibende Zeit berechnen
            let remain = totalNightMins - elapsedNightMins;
            let rh = Math.floor(remain / 60);
            let rm = remain % 60;
            statusText.textContent = `Noch ${rh} h ${rm} min bis Sonnenaufgang`;
        }

        // Werte eingrenzen (sicherheitshalber zwischen 0 und 100)
        progress = Math.max(0, Math.min(100, progress));

        // Animation auslösen (kurzer Delay damit CSS Transitions nach Load greifen)
        setTimeout(() => {
            fill.style.width = `${progress}%`;
            marker.style.left = `${progress}%`;
        }, 150);
    });
</script>

</body>
</html>
