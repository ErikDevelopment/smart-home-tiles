<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pflege</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --fg:#ffffff;
    --muted:#a0a4aa;
    --accent:#4da3ff;
    --warn:#f5c542;
    --error:#ff6b6b;
    --ok:#57d38c;
  }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent; overflow:hidden;
  }
  body{
    background:transparent;
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    display:flex; justify-content:flex-start; align-items:flex-start;
  }
  .tile{
    width:320px;
    padding:20px 22px;
    box-sizing:border-box;
    border-radius:22px;
    background:transparent;
  }
  .head{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em;
    margin-bottom:14px;
  }
  .head i{ font-size:13px; color:var(--accent); }

  .row{
    padding:10px 0;
    border-top:1px solid rgba(255,255,255,0.07);
  }
  .row:first-of-type{ border-top:none; padding-top:0; }

  .row-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .row-label{
    display:flex; align-items:center; gap:7px;
    font-size:12.5px;
    color:var(--muted);
  }
  .row-label i{ width:14px; text-align:center; color:var(--accent); font-size:12px; }
  .row-val{
    font-size:15px;
    font-weight:500;
  }

  .chips{
    margin-top:9px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    padding:4px 9px;
    border-radius:10px;
    background:rgba(255,255,255,0.06);
    color:var(--muted);
  }
  .chip.warn{
    color:var(--warn);
  }

  .all-ok{
    margin-top:9px;
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--ok);
  }

  .footer{
    margin-top:14px;
    font-size:10.5px;
    color:var(--muted);
    text-align:right;
  }
</style>
</head>
<body>
<main class="tile">
  <div class="head"><i class="fa-solid fa-screwdriver-wrench"></i> Pflege</div>

  <div class="row">
    <div class="row-top">
      <span class="row-label"><i class="fa-solid fa-cloud-arrow-down"></i> Adapter-Updates</span>
      <span class="row-val" id="updatesVal">–</span>
    </div>
    <div id="updatesWrap"></div>
  </div>

  <div class="row">
    <div class="row-top">
      <span class="row-label"><i class="fa-solid fa-server"></i> js-controller</span>
      <span class="row-val" id="controllerVal">–</span>
    </div>
  </div>

  <div class="row">
    <div class="row-top">
      <span class="row-label"><i class="fa-solid fa-box-archive"></i> Backup</span>
      <span class="row-val" id="backupVal">–</span>
    </div>
    <div class="row-sub" id="backupSub" style="margin-top:3px;font-size:11px;color:var(--muted);"></div>
  </div>

  <div class="row">
    <div class="row-top">
      <span class="row-label"><i class="fa-solid fa-triangle-exclamation"></i> Heute im Log</span>
      <span class="row-val" id="logVal">–</span>
    </div>
  </div>

  <div class="footer" id="lastCheck"></div>
</main>

<script>
/* URL-Parameter (alles optional, ohne Parameter laufen Dummy-Daten):
   ?updatesCount=&updatesList=hm-rpc,ping   (Kommagetrennte Adapternamen)
   &controllerUpdate=&controllerInstalled=&controllerLatest=
   &backupSuccess=&backupLastTime=&backupNextTime=
   &errorCount=&warnCount=&lastCheck= */
const p = new URLSearchParams(location.search);

function num(val, def){
  if (val === null || val === undefined || val === "") return def;
  const n = Number(val);
  return Number.isNaN(n) ? def : n;
}
function str(val, def){
  if (!val || typeof val !== "string") return def;
  return val;
}
function bool(val, def){
  if (val === null || val === undefined || val === "") return def;
  return String(val).toLowerCase() === "true";
}
function list(val, def){
  if (val === null || val === undefined || val === "") return def;
  return val.split(",").map(s => s.trim()).filter(Boolean);
}

const updatesCount = num(p.get("updatesCount"), 2);
const updatesList  = list(p.get("updatesList"), ["hm-rpc", "ping"]);

const controllerUpdate    = bool(p.get("controllerUpdate"), false);
const controllerInstalled = str(p.get("controllerInstalled"), "iobroker-master: 5.0.19");
const controllerLatest    = str(p.get("controllerLatest"), "5.0.19");

const backupSuccess  = bool(p.get("backupSuccess"), true);
const backupLastTime = str(p.get("backupLastTime"), "01. September 2026");
const backupNextTime = str(p.get("backupNextTime"), "02. September 2026");

const errorCount = num(p.get("errorCount"), 0);
const warnCount  = num(p.get("warnCount"), 3);

const lastCheck = str(p.get("lastCheck"), "");

/* ---- Adapter-Updates ---- */
const updatesEl = document.getElementById("updatesVal");
const updatesWrap = document.getElementById("updatesWrap");
if (updatesCount > 0) {
  updatesEl.textContent = updatesCount + (updatesCount === 1 ? " Update" : " Updates");
  updatesEl.style.color = "var(--warn)";
  const chips = updatesList.slice(0, 6).map(n => `<span class="chip warn"><i class="fa-solid fa-arrow-up"></i> ${n}</span>`).join("");
  const rest = updatesList.length - Math.min(6, updatesList.length);
  updatesWrap.innerHTML = `<div class="chips">${chips}${rest > 0 ? `<span class="chip warn">+${rest} weitere</span>` : ""}</div>`;
} else {
  updatesEl.textContent = "Aktuell";
  updatesEl.style.color = "var(--ok)";
  updatesWrap.innerHTML = `<div class="all-ok"><i class="fa-solid fa-circle-check"></i> Alle Adapter aktuell</div>`;
}

/* ---- js-controller ---- */
const controllerEl = document.getElementById("controllerVal");
if (controllerUpdate) {
  controllerEl.innerHTML = `Update verfügbar${controllerLatest ? ` <span style="color:var(--muted);font-size:11px;font-weight:400">(${controllerLatest})</span>` : ""}`;
  controllerEl.style.color = "var(--warn)";
} else {
  controllerEl.textContent = "Aktuell";
  controllerEl.style.color = "var(--ok)";
}

/* ---- Backup ---- */
const backupEl = document.getElementById("backupVal");
const backupSubEl = document.getElementById("backupSub");
if (backupLastTime) {
  backupEl.textContent = backupSuccess ? "Erfolgreich" : "Fehlgeschlagen";
  backupEl.style.color = backupSuccess ? "var(--ok)" : "var(--error)";
  backupSubEl.textContent =
    backupLastTime + (backupNextTime ? ` · Nächstes: ${backupNextTime}` : "");
} else {
  backupEl.textContent = "Keine Daten";
  backupEl.style.color = "var(--muted)";
}

/* ---- Log-Zaehler ---- */
const logEl = document.getElementById("logVal");
const logColor = errorCount > 0 ? "var(--error)" : (warnCount > 0 ? "var(--warn)" : "var(--ok)");
logEl.style.color = logColor;
logEl.innerHTML = `${errorCount} Fehler <span style="color:var(--muted);font-size:11px;font-weight:400">· ${warnCount} Warnungen</span>`;

/* ---- Footer ---- */
if (lastCheck) {
  document.getElementById("lastCheck").textContent = "Zuletzt geprüft: " + lastCheck;
}
</script>
</body>
</html>
