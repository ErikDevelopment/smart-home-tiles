<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energiefluss</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --fg:#ffffff;
    --muted:#a0a4aa;
    --accent:#4da3ff;
    --sun:#f5c542;
    --ok:#57d38c;
    --error:#ff6b6b;
    --idle:#4a5058;
    --cons:#ff9f43;
    --charge:#4da3ff;
    --soc:#5ec8d8;
  }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent; overflow:hidden;
  }
  body{
    background:transparent;
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    display:flex; justify-content:flex-start; align-items:flex-start;
  }
  .tile{
    width:340px;
    padding:20px;
    box-sizing:border-box;
    border-radius:22px;
    background:transparent;
  }
  .head{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em;
    margin-bottom:6px;
  }
  .head i{ font-size:13px; color:var(--sun); }

  .diagram{ width:100%; height:auto; display:block; }

  .node-label{
    font-size:9px;
    fill:var(--muted);
    text-anchor:middle;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .node-value{
    font-size:13px;
    font-weight:600;
    fill:var(--fg);
    text-anchor:middle;
  }
  .node-sub{
    font-size:8.5px;
    fill:var(--muted);
    text-anchor:middle;
  }
  .node-extra{
    font-size:8px;
    font-weight:600;
    text-anchor:middle;
  }

  .spoke-line{
    stroke:rgba(255,255,255,0.10);
    stroke-width:3;
    fill:none;
  }

  .dot{
    filter:drop-shadow(0 0 2px rgba(0,0,0,0.4));
  }

  .sun-ray{
    stroke:var(--sun);
    stroke-linecap:round;
  }
  .sun-core{ fill:url(#sunCoreGrad); }
  .sun-glow, .sun-glow-outer{
    fill:var(--sun);
    opacity:0;
  }
  .sun-active .sun-glow{
    animation:sunPulse 2.4s ease-in-out infinite;
  }
  .sun-active .sun-glow-outer{
    animation:sunPulseOuter 2.4s ease-in-out infinite;
    animation-delay:.5s;
  }
  @keyframes sunPulse{
    0%,100%{ opacity:0.12; r:22; }
    50%{ opacity:0.26; r:27; }
  }
  @keyframes sunPulseOuter{
    0%,100%{ opacity:0.05; r:29; }
    50%{ opacity:0.13; r:36; }
  }

  .batt-fill{ transition:height .6s ease, y .6s ease, fill .3s ease; }

  .house-body{ fill:#2a2f36; stroke:rgba(255,255,255,0.15); stroke-width:1.5; }
  .house-roof{ fill:#333941; stroke:rgba(255,255,255,0.15); stroke-width:1.5; }

  .stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
  }
  .stat-card{
    min-width:0;
    background:rgba(255,255,255,0.045);
    border-radius:14px;
    padding:12px 12px 9px;
    box-sizing:border-box;
  }
  .stat-title{
    display:flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; color:var(--fg);
    margin-bottom:1px;
  }
  .stat-title .dot-marker{
    width:6px; height:6px; border-radius:50%; flex:none;
  }
  .stat-value{
    font-size:18px; font-weight:700; color:var(--fg);
    white-space:nowrap;
  }
  .stat-value span{
    font-size:10.5px; font-weight:500; color:var(--muted); margin-left:2px;
  }
  .stat-sub{
    font-size:9px; color:var(--muted); margin-bottom:6px;
  }
  .spark{ width:100%; height:32px; display:block; }
  .spark-axis{
    display:flex; justify-content:space-between;
    font-size:7.5px; color:var(--muted); margin-top:1px;
  }
</style>
</head>
<body>
<main class="tile">
  <div class="head"><i class="fa-solid fa-solar-panel"></i> Energiefluss</div>

  <svg class="diagram" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <radialGradient id="sunCoreGrad" cx="35%" cy="32%" r="68%">
        <stop offset="0%"  stop-color="#fff6d8"/>
        <stop offset="45%" stop-color="var(--sun)"/>
        <stop offset="100%" stop-color="#d98f1f"/>
      </radialGradient>
    </defs>

    <!-- Verbindungslinien -->
    <path id="pvPath"   class="spoke-line" d="M150,64 L150,132"/>
    <path id="battPath" class="spoke-line" d="M64,150 L118,150"/>
    <path id="netzPath" class="spoke-line" d="M236,150 L182,150"/>
    <path id="wbPath"   class="spoke-line" d="M150,236 L150,182"/>

    <!-- Haus (Mitte) -->
    <g id="hausGroup" transform="translate(150,150)">
      <path class="house-roof" d="M-26,-4 L0,-24 L26,-4 L20,-4 L20,-4 Z"/>
      <rect class="house-body" x="-20" y="-4" width="40" height="28" rx="3"/>
      <rect x="-6" y="10" width="12" height="14" rx="1.5" fill="#1c2126"/>
      <text class="node-value" y="42">—</text>
      <text class="node-sub" id="hausSub" y="53">Hausverbrauch</text>
    </g>

    <!-- Sonne / PV (oben) -->
    <g id="sunGroup" transform="translate(150,44)">
      <circle class="sun-glow-outer" r="29"/>
      <circle class="sun-glow" r="22"/>
      <g id="sunRays">
        <line class="sun-ray" x1="0.0" y1="-12.0" x2="0.0" y2="-20.0" stroke-width="2.4"/>
        <line class="sun-ray" x1="6.5" y1="-11.3" x2="8.5" y2="-14.7" stroke-width="1.6"/>
        <line class="sun-ray" x1="10.4" y1="-6.0" x2="17.3" y2="-10.0" stroke-width="2.4"/>
        <line class="sun-ray" x1="13.0" y1="0.0" x2="17.0" y2="0.0" stroke-width="1.6"/>
        <line class="sun-ray" x1="10.4" y1="6.0" x2="17.3" y2="10.0" stroke-width="2.4"/>
        <line class="sun-ray" x1="6.5" y1="11.3" x2="8.5" y2="14.7" stroke-width="1.6"/>
        <line class="sun-ray" x1="0.0" y1="12.0" x2="0.0" y2="20.0" stroke-width="2.4"/>
        <line class="sun-ray" x1="-6.5" y1="11.3" x2="-8.5" y2="14.7" stroke-width="1.6"/>
        <line class="sun-ray" x1="-10.4" y1="6.0" x2="-17.3" y2="10.0" stroke-width="2.4"/>
        <line class="sun-ray" x1="-13.0" y1="0.0" x2="-17.0" y2="0.0" stroke-width="1.6"/>
        <line class="sun-ray" x1="-10.4" y1="-6.0" x2="-17.3" y2="-10.0" stroke-width="2.4"/>
        <line class="sun-ray" x1="-6.5" y1="-11.3" x2="-8.5" y2="-14.7" stroke-width="1.6"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0 0 0" to="360 0 0" begin="-8s" dur="70s" repeatCount="indefinite"/>
      </g>
      <circle class="sun-core" r="11.5" stroke="#c97f14" stroke-width="0.6"/>
      <text class="node-value" y="36">—</text>
      <text class="node-sub" y="47">PV</text>
      <text class="node-extra" id="pvShare" y="58"></text>
    </g>

    <!-- Batterie (links) -->
    <g id="battGroup" transform="translate(44,150)">
      <rect x="-11" y="-16" width="22" height="32" rx="3" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <rect x="-4" y="-19" width="8" height="3" rx="1" fill="rgba(255,255,255,0.25)"/>
      <rect id="battFill" class="batt-fill" x="-9" y="12" width="18" height="0" rx="1.5" fill="var(--ok)"/>
      <text class="node-value" y="34">—</text>
      <text class="node-sub" id="battSub" y="45">Batterie</text>
    </g>

    <!-- Netz (rechts) -->
    <g id="netzGroup" transform="translate(256,150)">
      <circle r="15" fill="rgba(255,255,255,0.06)"/>
      <path d="M2,-9 L-6,2 L-1,2 L-3,9 L6,-2 L1,-2 Z" fill="var(--muted)" id="netzBolt"/>
      <text class="node-value" y="34">—</text>
      <text class="node-sub" id="netzSub" y="45">Netz</text>
    </g>

    <!-- Wallbox (unten) -->
    <g id="wbGroup" transform="translate(150,256)">
      <circle r="15" fill="rgba(255,255,255,0.06)"/>
      <path d="M-6,-7 L4,-7 L4,-2 L6,-2 L6,7 L-6,7 Z" fill="var(--idle)" id="wbIcon"/>
      <text class="node-value" y="34">—</text>
      <text class="node-sub" y="45">Wallbox</text>
    </g>

    <!-- Fluss-Punkte (Position per JS gesetzt) -->
    <g id="pvDots"></g>
    <g id="battDots"></g>
    <g id="netzDots"></g>
    <g id="wbDots"></g>

  </svg>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-title"><span class="dot-marker" style="background:var(--ok)"></span>Produktion</div>
      <div class="stat-value" id="prodValue">—<span>kWh</span></div>
      <div class="stat-sub">Heute</div>
      <svg class="spark" id="prodSpark" viewBox="0 0 240 60" preserveAspectRatio="none"></svg>
      <div class="spark-axis"><span>00:00</span><span>24:00</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-title"><span class="dot-marker" style="background:var(--cons)"></span>Verbrauch</div>
      <div class="stat-value" id="consValue">—<span>kWh</span></div>
      <div class="stat-sub">Heute</div>
      <svg class="spark" id="consSpark" viewBox="0 0 240 60" preserveAspectRatio="none"></svg>
      <div class="spark-axis"><span>00:00</span><span>24:00</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-title"><span class="dot-marker" style="background:var(--ok)"></span>Batterie</div>
      <div class="stat-value" id="battValue">—<span>kWh</span></div>
      <div class="stat-sub" id="battSubDaily">Netto heute</div>
      <svg class="spark" id="battSpark" viewBox="0 0 240 60" preserveAspectRatio="none"></svg>
      <div class="spark-axis"><span>00:00</span><span>24:00</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-title"><span class="dot-marker" style="background:var(--soc)"></span>Ladezustand</div>
      <div class="stat-value" id="socValue">—</div>
      <div class="stat-sub">Spanne heute</div>
      <svg class="spark" id="socSpark" viewBox="0 0 240 60" preserveAspectRatio="none"></svg>
      <div class="spark-axis"><span>00:00</span><span>24:00</span></div>
    </div>
  </div>
</main>

<script>
/* URL-Parameter (alles optional, ohne Parameter laufen Dummy-Daten):
   ?pv=            PV-Gesamtleistung in W (immer >=0)
   &batterie=      Batterieleistung in W (+ = Entladen -> Haus, - = Laden -> Batterie)
   &batterieSoc=   Ladezustand in % (0-100)
   &netz=          Netzleistung in W (+ = Bezug -> Haus, - = Einspeisung -> Netz)
   &hausverbrauch= Hausverbrauch in W
   &wallbox=       Wallbox-Ladeleistung in W (immer >=0)
   &prodToday=     PV-Ertrag heute in kWh
   &consToday=     Hausverbrauch heute in kWh
   &battToday=     Batterie-Nettoenergie heute in kWh (+ = netto entladen, - = netto geladen)
   &prodCurve=     Kommagetrennte PV-Leistungswerte (W) ueber den Tag, ca. alle 15min
   &consCurve=     Kommagetrennte Verbrauchswerte (W) ueber den Tag, ca. alle 15min
   &battCurve=     Kommagetrennte Batterieleistungswerte (W, +/-) ueber den Tag, ca. alle 15min
   &socCurve=      Kommagetrennte Ladezustands-Werte (%, 0-100) ueber den Tag, ca. alle 15min */
const p = new URLSearchParams(location.search);

function num(val, def){
  if (val === null || val === undefined || val === "") return def;
  const n = Number(String(val).replace(",", "."));
  return Number.isNaN(n) ? def : n;
}

function curve(val, def){
  if (val === null || val === undefined || val === "") return def;
  const arr = String(val).split(",").map(s => Number(s.replace(",", "."))).filter(n => !Number.isNaN(n));
  return arr.length >= 2 ? arr : def;
}

const pv        = num(p.get("pv"), 1622);
const batterie  = num(p.get("batterie"), 0);
const battSoc   = num(p.get("batterieSoc"), 100);
const netz      = num(p.get("netz"), -2400.6);
const haus      = num(p.get("hausverbrauch"), 0);
const wallbox   = num(p.get("wallbox"), 0);

const DUMMY_PROD_CURVE = [0,0,0,0,50,320,980,1850,2650,3150,3420,3180,2960,3280,3080,2560,1780,880,180,0];
const DUMMY_CONS_CURVE = [420,390,360,330,300,350,430,510,600,650,700,680,650,700,760,910,1420,2180,2760,2380];
const DUMMY_BATT_CURVE = [0,0,0,0,-50,-300,-600,-900,-1100,-1200,-1000,-700,-400,-200,100,400,700,900,600,300];
const DUMMY_SOC_CURVE  = [38,38,39,40,45,55,65,75,83,89,93,95,96,96,95,93,90,86,83,80];

const prodToday = num(p.get("prodToday"), 24.96);
const consToday = num(p.get("consToday"), 13.38);
const battToday = num(p.get("battToday"), -1.42);
const prodCurve = curve(p.get("prodCurve"), DUMMY_PROD_CURVE);
const consCurve = curve(p.get("consCurve"), DUMMY_CONS_CURVE);
const battCurve = curve(p.get("battCurve"), DUMMY_BATT_CURVE);
const socCurve  = curve(p.get("socCurve"), DUMMY_SOC_CURVE);

function fmtPower(w){
  const abs = Math.abs(w);
  if (abs >= 1000) return (w / 1000).toFixed(1).replace(".", ",") + " kW";
  return Math.round(w) + " W";
}

/* Animationsdauer abhaengig von der Leistung - mehr Watt = schneller */
function speedFor(watt){
  const abs = Math.abs(watt);
  const dur = 3 - Math.min(abs / 1500, 1) * 2; // 3s (wenig) bis 1s (viel)
  return Math.max(1, dur);
}

/* Erzeugt 3 animierte Punkte entlang eines Pfads.
   forward=true: Punkte laufen in Pfadrichtung (Anfang->Ende)
   forward=false: Punkte laufen rueckwaerts (Ende->Anfang) */
function animateDots(groupId, pathId, active, forward, watt, color){
  const group = document.getElementById(groupId);
  group.innerHTML = "";
  if (!active) return;

  const dur = speedFor(watt);
  const offsets = [0, 0.33, 0.66];

  offsets.forEach(offset => {
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("r", "3.2");
    dot.setAttribute("fill", color);
    dot.setAttribute("class", "dot");

    const anim = document.createElementNS("http://www.w3.org/2000/svg", "animateMotion");
    anim.setAttribute("dur", dur + "s");
    anim.setAttribute("repeatCount", "indefinite");
    anim.setAttribute("begin", (-offset * dur) + "s");
    if (!forward) {
      anim.setAttribute("keyPoints", "1;0");
      anim.setAttribute("keyTimes", "0;1");
      anim.setAttribute("calcMode", "linear");
    }

    const mpath = document.createElementNS("http://www.w3.org/2000/svg", "mpath");
    mpath.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#" + pathId);
    anim.appendChild(mpath);
    dot.appendChild(anim);
    group.appendChild(dot);
  });
}

/* ---- PV ---- */
document.getElementById("sunGroup").querySelector(".node-value").textContent = fmtPower(pv);
if (pv > 0) document.getElementById("sunGroup").classList.add("sun-active");
animateDots("pvDots", "pvPath", pv > 0, true, pv, "var(--sun)");

/* Anteil der PV-Erzeugung am aktuellen Hausverbrauch
   (nur sinnvoll, wenn tatsaechlich ein Verbrauch > 0 vorliegt) */
const pvShareEl = document.getElementById("pvShare");
if (haus > 0) {
  const share = Math.min(pv / haus, 1) * 100;
  pvShareEl.textContent = Math.round(share) + "% v. Verbrauch";
  pvShareEl.setAttribute("fill",
    share >= 80 ? "var(--ok)" : share >= 40 ? "var(--sun)" : "var(--muted)");
} else {
  pvShareEl.textContent = "";
}

/* ---- Batterie ---- */
document.getElementById("battFill").setAttribute("height", (battSoc / 100 * 26));
document.getElementById("battFill").setAttribute("y", 12 - (battSoc / 100 * 26));
document.getElementById("battFill").setAttribute("fill", battSoc < 20 ? "var(--error)" : (battSoc < 40 ? "var(--sun)" : "var(--ok)"));

document.getElementById("battGroup").querySelector(".node-value").textContent = battSoc.toFixed(0) + "%";
document.getElementById("battSub").textContent =
  batterie > 0 ? "Entlädt · " + fmtPower(batterie) :
  batterie < 0 ? "Lädt · " + fmtPower(Math.abs(batterie)) :
  "Batterie";

animateDots("battDots", "battPath", batterie !== 0, batterie > 0, batterie, "var(--ok)");

/* ---- Netz ---- */
document.getElementById("netzGroup").querySelector(".node-value").textContent = fmtPower(Math.abs(netz));
document.getElementById("netzSub").textContent = netz > 0 ? "Bezug" : netz < 0 ? "Einspeisung" : "Netz";
document.getElementById("netzBolt").setAttribute("fill", netz > 0 ? "var(--error)" : netz < 0 ? "var(--ok)" : "var(--idle)");
animateDots("netzDots", "netzPath", netz !== 0, netz > 0, netz, netz > 0 ? "var(--error)" : "var(--ok)");

/* ---- Haus ---- */
document.getElementById("hausGroup").querySelector(".node-value").textContent = fmtPower(haus);

/* ---- Wallbox ---- */
const wbValueEl = document.getElementById("wbGroup").querySelector(".node-value");
wbValueEl.textContent = fmtPower(wallbox);
document.getElementById("wbIcon").setAttribute("fill", wallbox > 0 ? "var(--accent)" : "var(--idle)");
animateDots("wbDots", "wbPath", wallbox > 0, false, wallbox, "var(--accent)");

/* ---- Tageswerte: Produktion / Verbrauch ---- */
const NS = "http://www.w3.org/2000/svg";

function drawSpark(svgId, values, color, range){
  const svg = document.getElementById(svgId);
  svg.innerHTML = "";
  if (!values || values.length < 2) return;

  const w = 240, h = 60, pad = 4;
  const min = range ? range[0] : 0;
  const max = range ? range[1] : Math.max(...values, 1);
  const span = (max - min) || 1;
  const stepX = w / (values.length - 1);
  const pts = values.map((v, i) => [
    i * stepX,
    pad + (h - pad * 2) * (1 - (v - min) / span)
  ]);

  const linePath = "M" + pts.map(pt => pt.join(",")).join(" L");
  const last = pts[pts.length - 1];
  const areaPath = linePath + ` L${last[0]},${h} L0,${h} Z`;

  const gradId = svgId + "Grad";
  const defs = document.createElementNS(NS, "defs");
  const grad = document.createElementNS(NS, "linearGradient");
  grad.setAttribute("id", gradId);
  grad.setAttribute("x1", "0"); grad.setAttribute("y1", "0");
  grad.setAttribute("x2", "0"); grad.setAttribute("y2", "1");
  const s1 = document.createElementNS(NS, "stop");
  s1.setAttribute("offset", "0%"); s1.setAttribute("stop-color", color); s1.setAttribute("stop-opacity", "0.35");
  const s2 = document.createElementNS(NS, "stop");
  s2.setAttribute("offset", "100%"); s2.setAttribute("stop-color", color); s2.setAttribute("stop-opacity", "0");
  grad.appendChild(s1); grad.appendChild(s2);
  defs.appendChild(grad);
  svg.appendChild(defs);

  const area = document.createElementNS(NS, "path");
  area.setAttribute("d", areaPath);
  area.setAttribute("fill", `url(#${gradId})`);
  svg.appendChild(area);

  const line = document.createElementNS(NS, "path");
  line.setAttribute("d", linePath);
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", color);
  line.setAttribute("stroke-width", "2");
  line.setAttribute("stroke-linecap", "round");
  line.setAttribute("stroke-linejoin", "round");
  svg.appendChild(line);

  const dot = document.createElementNS(NS, "circle");
  dot.setAttribute("cx", last[0]); dot.setAttribute("cy", last[1]); dot.setAttribute("r", "3");
  dot.setAttribute("fill", color);
  svg.appendChild(dot);
}

/* Kurve mit Nulllinie: positive Werte (Entladen) gruen ueber der
   Mitte, negative Werte (Laden) blau darunter - zwei Flaechen mit
   gemeinsamer Basislinie bei 0. */
function drawDivergingSpark(svgId, values, posColor, negColor){
  const svg = document.getElementById(svgId);
  svg.innerHTML = "";
  if (!values || values.length < 2) return;

  const w = 240, h = 60, pad = 4;
  const maxAbs = Math.max(...values.map(Math.abs), 1);
  const stepX = w / (values.length - 1);
  const zeroY = h / 2;
  const scale = (h / 2 - pad) / maxAbs;

  const pts = values.map((v, i) => [i * stepX, zeroY - v * scale]);
  const linePath = "M" + pts.map(pt => pt.join(",")).join(" L");

  const posPts = pts.map(([x, y]) => [x, Math.min(y, zeroY)]);
  const negPts = pts.map(([x, y]) => [x, Math.max(y, zeroY)]);
  const posArea = "M" + posPts.map(pt => pt.join(",")).join(" L") + ` L${posPts[posPts.length-1][0]},${zeroY} L${posPts[0][0]},${zeroY} Z`;
  const negArea = "M" + negPts.map(pt => pt.join(",")).join(" L") + ` L${negPts[negPts.length-1][0]},${zeroY} L${negPts[0][0]},${zeroY} Z`;

  const posFill = document.createElementNS(NS, "path");
  posFill.setAttribute("d", posArea);
  posFill.setAttribute("fill", posColor);
  posFill.setAttribute("opacity", "0.25");
  svg.appendChild(posFill);

  const negFill = document.createElementNS(NS, "path");
  negFill.setAttribute("d", negArea);
  negFill.setAttribute("fill", negColor);
  negFill.setAttribute("opacity", "0.25");
  svg.appendChild(negFill);

  const zeroLine = document.createElementNS(NS, "line");
  zeroLine.setAttribute("x1", "0"); zeroLine.setAttribute("x2", w);
  zeroLine.setAttribute("y1", zeroY); zeroLine.setAttribute("y2", zeroY);
  zeroLine.setAttribute("stroke", "rgba(255,255,255,0.12)");
  zeroLine.setAttribute("stroke-width", "1");
  svg.appendChild(zeroLine);

  const line = document.createElementNS(NS, "path");
  line.setAttribute("d", linePath);
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", "rgba(255,255,255,0.55)");
  line.setAttribute("stroke-width", "1.6");
  line.setAttribute("stroke-linecap", "round");
  line.setAttribute("stroke-linejoin", "round");
  svg.appendChild(line);

  const last = pts[pts.length - 1];
  const dot = document.createElementNS(NS, "circle");
  dot.setAttribute("cx", last[0]); dot.setAttribute("cy", last[1]); dot.setAttribute("r", "3");
  dot.setAttribute("fill", values[values.length - 1] >= 0 ? posColor : negColor);
  svg.appendChild(dot);
}

document.getElementById("prodValue").innerHTML = prodToday.toFixed(2).replace(".", ",") + "<span>kWh</span>";
document.getElementById("consValue").innerHTML = consToday.toFixed(2).replace(".", ",") + "<span>kWh</span>";
drawSpark("prodSpark", prodCurve, "var(--ok)");
drawSpark("consSpark", consCurve, "var(--cons)");

/* ---- Batterie-Karte: Netto-kWh + Lade-/Entladekurve ---- */
const battValueEl = document.getElementById("battValue");
battValueEl.innerHTML =
  (battToday >= 0 ? "+" : "") + battToday.toFixed(2).replace(".", ",") + "<span>kWh</span>";
battValueEl.style.color = battToday > 0 ? "var(--ok)" : battToday < 0 ? "var(--charge)" : "var(--fg)";
document.getElementById("battSubDaily").textContent =
  battToday > 0 ? "Netto entladen" : battToday < 0 ? "Netto geladen" : "Netto heute";
drawDivergingSpark("battSpark", battCurve, "var(--ok)", "var(--charge)");

/* ---- Ladezustand-Karte: Spanne heute + SOC-Verlauf ---- */
if (socCurve && socCurve.length >= 2) {
  const socMin = Math.min(...socCurve);
  const socMax = Math.max(...socCurve);
  document.getElementById("socValue").textContent = socMin.toFixed(0) + "–" + socMax.toFixed(0) + "%";
} else {
  document.getElementById("socValue").textContent = "—";
}
drawSpark("socSpark", socCurve, "var(--soc)", [0, 100]);
</script>
</body>
</html>
