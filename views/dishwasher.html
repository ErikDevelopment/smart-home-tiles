<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geschirrspüler</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --fg:#ffffff;
    --muted:#a0a4aa;
    --accent:#4da3ff;
    --warn:#f5c542;
    --error:#ff6b6b;
    --ok:#57d38c;
    --idle:#5b6472;
  }
  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:transparent;
    overflow:hidden;
  }
  body{
    background:transparent;
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  /* =========================================================
     GESCHIRRSPUELER-KARTE
  ========================================================= */
  .dw-card{
    width:380px;
    padding:22px;
    box-sizing:border-box;
    border-radius:24px;
    background:transparent;
    position:relative;
    z-index:2;
  }

  /* ---------------- ILLUSTRATION ---------------- */
  .illustration-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:8px;
  }
  .dw-svg{
    width:150px;
    height:150px;
    overflow:visible;
  }

  #dwStatusGlow{
    stroke:var(--idle);
    opacity:.35;
    transition:stroke .4s ease, opacity .4s ease;
  }
  .dw-svg.state-run #dwStatusGlow{
    stroke:var(--ok);
    animation:pulse-glow 1.6s ease-in-out infinite;
  }
  .dw-svg.state-delayedstart #dwStatusGlow{ stroke:var(--accent); opacity:.55; }
  .dw-svg.state-pause #dwStatusGlow{ stroke:var(--warn); opacity:.6; }
  .dw-svg.state-actionrequired #dwStatusGlow{
    stroke:var(--warn);
    animation:pulse-glow 1s ease-in-out infinite;
  }
  .dw-svg.state-error #dwStatusGlow{
    stroke:var(--error);
    animation:pulse-glow .9s ease-in-out infinite;
  }
  .dw-svg.state-finished #dwStatusGlow{ stroke:var(--ok); opacity:.7; }
  @keyframes pulse-glow{
    0%,100%{ opacity:.35; }
    50%{ opacity:.85; }
  }

  /* Sprueharm dreht sich im Betrieb */
  #dwSprayArm{
    transform-box: fill-box;
    transform-origin: center;
  }
  .dw-svg.state-run #dwSprayArm{
    animation: spray-spin .9s linear infinite;
  }
  @keyframes spray-spin{
    to{ transform: rotate(360deg); }
  }

  /* Dampf steigt im Betrieb */
  .steam-wisp{ opacity:0; }
  .dw-svg.state-run .steam-wisp{
    animation: steam-rise 2.2s ease-in infinite;
  }
  .dw-svg.state-run .steam-wisp:nth-child(2){ animation-delay:.5s; }
  .dw-svg.state-run .steam-wisp:nth-child(3){ animation-delay:1s; }
  @keyframes steam-rise{
    0%{ transform:translateY(0); opacity:0; }
    30%{ opacity:.55; }
    100%{ transform:translateY(-16px); opacity:0; }
  }

  /* Sockel-Lichtleiste zeigt Status-Farbe */
  #dwFloorLight{
    fill:var(--idle);
    transition:fill .4s ease;
  }
  .dw-svg.state-run #dwFloorLight{ fill:var(--ok); }
  .dw-svg.state-pause #dwFloorLight,
  .dw-svg.state-actionrequired #dwFloorLight,
  .dw-svg.state-delayedstart #dwFloorLight{ fill:var(--warn); }
  .dw-svg.state-error #dwFloorLight{ fill:var(--error); }
  .dw-svg.state-finished #dwFloorLight{ fill:var(--ok); }

  /* ---------------- TEXT-INFO ---------------- */
  .info{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    text-align:left;
  }
  .program{
    font-size:24px;
    font-weight:500;
    line-height:1.2;
  }
  .status-row{
    margin-top:6px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    color:#ddd;
  }
  .status-row i{ color:var(--accent); font-size:16px; }
  .status-row.state-run i{ color:var(--ok); }
  .status-row.state-pause i,
  .status-row.state-actionrequired i,
  .status-row.state-delayedstart i{ color:var(--warn); }
  .status-row.state-error i{ color:var(--error); }

  .door-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
    text-align:right;
  }
  .door-row.door-open{ color:var(--warn); }

  /* PROGRESS */
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:20px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background:rgba(255,255,255,0.12);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:var(--accent);
    border-radius:4px;
    transition:width .5s ease;
  }
  .progress-pct{
    font-size:13px;
    color:var(--muted);
    min-width:34px;
    text-align:right;
  }

  /* ENDZEIT */
  .endtime{
    margin-top:14px;
    font-size:14px;
    color:var(--muted);
  }
</style>
</head>
<body>
<main class="dw-card">

  <div class="illustration-wrap">
    <svg id="dwSvg" class="dw-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="doorGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f4f6f8"/>
          <stop offset="55%" stop-color="#dde2e6"/>
          <stop offset="100%" stop-color="#eef1f4"/>
        </linearGradient>
        <radialGradient id="windowGradient" cx="35%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#2b3440"/>
          <stop offset="70%" stop-color="#12161c"/>
          <stop offset="100%" stop-color="#08090d"/>
        </radialGradient>
      </defs>

      <g class="dw-body">
        <!-- Gehaeuse / Tuer -->
        <rect x="15" y="10" width="190" height="200" rx="14" fill="url(#doorGradient)" stroke="#c7cdd3" stroke-width="2"/>

        <!-- Bedienpanel oben -->
        <rect x="15" y="10" width="190" height="26" rx="14" fill="#262b33"/>
        <rect x="15" y="24" width="190" height="12" fill="#262b33"/>
        <!-- Mini-Display -->
        <rect x="82" y="16" width="40" height="13" rx="2" fill="#0d0f13"/>
        <text id="dwDisplayText" x="102" y="26" text-anchor="middle" font-size="9" fill="#57d38c" font-family="monospace">--:--</text>
        <!-- Tasten -->
        <circle cx="148" cy="23" r="5" fill="#3a4048"/>
        <circle cx="163" cy="23" r="5" fill="#3a4048"/>
        <circle cx="178" cy="23" r="5" fill="#3a4048"/>

        <!-- Griffleiste -->
        <rect x="35" y="46" width="150" height="10" rx="5" fill="#c7cdd3"/>

        <!-- Dampf (steigt im Betrieb, aus dem Tuerspalt) -->
        <path class="steam-wisp" d="M92,44 q-4,-9 0,-16" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
        <path class="steam-wisp" d="M110,44 q4,-11 0,-18" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
        <path class="steam-wisp" d="M128,44 q-4,-9 0,-16" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>

        <!-- Status-Glow -->
        <circle id="dwStatusGlow" cx="110" cy="140" r="48" fill="none" stroke-width="5"/>

        <!-- Sichtfenster -->
        <circle cx="110" cy="140" r="40" fill="url(#windowGradient)" stroke="#9aa2ab" stroke-width="2"/>

        <!-- Geschirr (statisch) -->
        <g id="dwDishes">
          <circle cx="94" cy="152" r="9" fill="#7fd9c4" opacity="0.75"/>
          <circle cx="126" cy="152" r="9" fill="#ff9fb0" opacity="0.75"/>
          <rect x="99" y="120" width="22" height="8" rx="3" fill="#ffd97f" opacity="0.75"/>
        </g>

        <!-- Sprueharm (rotiert im Betrieb) -->
        <g id="dwSprayArm">
          <line x1="110" y1="140" x2="110" y2="110" stroke="#c7cdd3" stroke-width="3" stroke-linecap="round"/>
          <line x1="110" y1="140" x2="133" y2="153" stroke="#c7cdd3" stroke-width="3" stroke-linecap="round"/>
          <line x1="110" y1="140" x2="87" y2="153" stroke="#c7cdd3" stroke-width="3" stroke-linecap="round"/>
          <circle cx="110" cy="140" r="4" fill="#c7cdd3"/>
        </g>

        <!-- Sockel-Lichtleiste -->
        <rect id="dwFloorLight" x="35" y="204" width="150" height="4" rx="2"/>
      </g>
    </svg>
  </div>

  <div class="info">
    <div>
      <div class="program" id="program">–</div>
      <div class="status-row" id="statusRow">
        <i id="stateIcon" class="fa-solid fa-question"></i>
        <span id="statusLabel">–</span>
      </div>
    </div>
    <div class="door-row" id="doorRow">
      <i id="doorIcon" class="fa-solid fa-door-closed"></i>
      <span id="doorLabel">–</span>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <span class="progress-pct" id="progressPct">0%</span>
  </div>

  <div class="endtime" id="endtime" style="display:none"></div>
</main>

<script>
/* ======================================================
   GESCHIRRSPUELER-WIDGET
   Erwartete URL-Parameter (gleiches Schema wie beim Waschmaschinen-Widget):
   ?state=...        (BSH_Common_Status_OperationState, roh)
   &door=...         (BSH_Common_Status_DoorState, roh)
   &program=...      (BSH_Common_Root_ActiveProgram, roh)
   &remaining=...    (RemainingProgramTime in Sekunden)
   &progress=...     (ProgramProgress in Prozent, 0-100)
   &remoteactive=... (true/false)
   &remotestart=...  (true/false)

   Ohne Parameter (z.B. direkt im Browser geoeffnet) laeuft die Seite
   mit Dummy-Daten (state=Run), damit man die Animation sofort sieht.
====================================================== */
const p = new URLSearchParams(location.search);

/* ===============================
   SAFE PARSE HELPERS
================================ */
function str(val, def){
  if (!val || typeof val !== "string") return def;
  return val.trim() || def;
}
function num(val, def, min = -Infinity, max = Infinity){
  if (val === null || val === undefined || val === "") return def;
  const n = Number(val);
  if (Number.isNaN(n)) return def;
  if (n < min || n > max) return def;
  return n;
}
function bool(val, def = false){
  if (val === null || val === undefined || val === "") return def;
  return String(val).toLowerCase() === "true";
}

/* Dummy-Werte, solange kein/kein gueltiger Parameter uebergeben wird */
const rawState     = str(p.get("state"), "Run");
const rawDoor      = str(p.get("door"), "Closed");
const rawProgram   = str(p.get("program"), "Dishcare.Dishwasher.Program.Eco50");
const remainingSec = num(p.get("remaining"), 1800, 0, 100000);
const progress      = num(p.get("progress"), 40, 0, 100);
const remoteActive  = bool(p.get("remoteactive"), true);
const remoteStart   = bool(p.get("remotestart"), false);

/* ===============================
   ÜBERSETZUNGEN
================================ */
function translateState(raw){
  const t = raw.toLowerCase();
  if (t.includes("delayedstart")) return { key:"delayedstart", label:"Startet verzögert", icon:"fa-clock" };
  if (t.includes("run"))          return { key:"run",          label:"Läuft",             icon:"fa-arrows-rotate" };
  if (t.includes("pause"))        return { key:"pause",         label:"Pausiert",          icon:"fa-pause" };
  if (t.includes("actionrequired")) return { key:"actionrequired", label:"Aktion erforderlich", icon:"fa-triangle-exclamation" };
  if (t.includes("finished"))     return { key:"finished",      label:"Fertig",            icon:"fa-circle-check" };
  if (t.includes("error"))        return { key:"error",         label:"Fehler",            icon:"fa-circle-exclamation" };
  if (t.includes("aborting"))     return { key:"aborting",      label:"Wird abgebrochen",  icon:"fa-circle-xmark" };
  if (t.includes("ready"))        return { key:"ready",         label:"Bereit",            icon:"fa-power-off" };
  if (t.includes("inactive"))     return { key:"inactive",      label:"Inaktiv",           icon:"fa-power-off" };
  return { key:"unknown", label:"Unbekannt", icon:"fa-question" };
}

function translateDoor(raw){
  const t = raw.toLowerCase();
  if (t.includes("locked")) return { key:"locked", label:"Verriegelt", icon:"fa-lock",       open:false };
  if (t.includes("open"))   return { key:"open",   label:"Offen",       icon:"fa-door-open",  open:true  };
  if (t.includes("closed")) return { key:"closed", label:"Geschlossen", icon:"fa-door-closed", open:false };
  return { key:"unknown", label:"Unbekannt", icon:"fa-door-closed", open:false };
}

const PROGRAM_NAMES = {
  Auto1: "Auto 1",
  Auto2: "Auto 2",
  Auto3: "Auto 3",
  Eco50: "Eco 50°",
  Intensiv70: "Intensiv 70°",
  Normal45: "Normal 45°",
  Kurz60: "Kurzprogramm 60°",
  Quick45: "Quick 45°",
  Quick65: "Quick 65°",
  Glas40: "Glas 40°",
  NightWash: "Nachtprogramm",
  PreRinse: "Vorspülen",
  MachineCare: "Maschinenpflege",
  Kurz30: "Kurzprogramm 30°"
};
function translateProgram(raw){
  if (!raw) return "Kein Programm aktiv";
  const last = raw.split(".").pop();
  if (PROGRAM_NAMES[last]) return PROGRAM_NAMES[last];
  return last.replace(/_/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2");
}

/* ===============================
   UI: PROGRAMM + STATUS
================================ */
const st = translateState(rawState);
document.getElementById("program").textContent = translateProgram(rawProgram);

const statusRow = document.getElementById("statusRow");
statusRow.className = "status-row state-" + st.key;
document.getElementById("statusLabel").textContent = st.label;
document.getElementById("stateIcon").className = "fa-solid " + st.icon;

/* Illustration: Status-Klasse fuer Glow/Animation setzen */
document.getElementById("dwSvg").classList.add("state-" + st.key);

/* ===============================
   UI: TÜR
================================ */
const door = translateDoor(rawDoor);
const doorRow = document.getElementById("doorRow");
doorRow.className = "door-row" + (door.open ? " door-open" : "");
document.getElementById("doorLabel").textContent = door.label;
document.getElementById("doorIcon").className = "fa-solid " + door.icon;

/* ===============================
   FORTSCHRITT
================================ */
const isActive = ["run", "pause", "delayedstart"].includes(st.key);
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const progressPct = document.getElementById("progressPct");
if (progress !== null && isActive) {
  progressWrap.style.display = "";
  progressBar.style.width = progress + "%";
  progressPct.textContent = Math.round(progress) + "%";
} else {
  progressWrap.style.display = "none";
}

/* ===============================
   ENDZEIT + MINI-DISPLAY
   (lebt weiter, auch ohne neue URL)
================================ */
const endtimeEl = document.getElementById("endtime");
const displayEl = document.getElementById("dwDisplayText");
let endTimestamp = null;
if (isActive && remainingSec > 0) {
  endTimestamp = Date.now() + remainingSec * 1000;
  endtimeEl.style.display = "";
  updateEndtimeText();
  setInterval(updateEndtimeText, 30000);
} else {
  endtimeEl.style.display = "none";
  displayEl.textContent = "--:--";
}
function updateEndtimeText(){
  if (!endTimestamp) return;
  const remainMs = endTimestamp - Date.now();
  if (remainMs <= 0) {
    endtimeEl.textContent = "Gleich fertig";
    displayEl.textContent = "00:00";
    return;
  }
  const end = new Date(endTimestamp);
  const hh = String(end.getHours()).padStart(2, "0");
  const mm = String(end.getMinutes()).padStart(2, "0");
  const remMin = Math.round(remainMs / 60000);
  const remH = Math.floor(remMin / 60);
  const remM = remMin % 60;
  const remText = remH > 0 ? `${remH} Std ${remM} Min` : `${remM} Min`;
  endtimeEl.textContent = `Fertig um ${hh}:${mm} (noch ${remText})`;
  displayEl.textContent = String(remH).padStart(2, "0") + ":" + String(remM).padStart(2, "0");
}
</script>
</body>
</html>
