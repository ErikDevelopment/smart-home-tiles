<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mülltonnen</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --fg:#ffffff;
    --muted:#a0a4aa;
    --accent:#4da3ff;
    --warn:#f5c542;
    --error:#ff6b6b;
    --ok:#57d38c;
    --idle:#5b6472;
  }
  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:transparent;
    overflow:hidden;
  }
  body{
    background:transparent;
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .trash-card{
    width:380px;
    padding:22px;
    box-sizing:border-box;
    border-radius:24px;
    background:transparent;
  }

  /* ---------------- HEADER: ILLUSTRATION + NAECHSTE ABHOLUNG ---------------- */
  .header{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .trash-svg{
    width:56px;
    height:56px;
    flex-shrink:0;
    overflow:visible;
  }
  #binGlow{
    stroke:none;
    fill:var(--idle);
    opacity:0;
    transition:opacity .4s ease;
  }
  .trash-svg.soon #binGlow{ fill:var(--warn); opacity:.18; }
  .trash-svg.urgent #binGlow{ fill:var(--warn); opacity:.28; animation:pulse-glow 1.4s ease-in-out infinite; }
  @keyframes pulse-glow{
    0%,100%{ opacity:.2; }
    50%{ opacity:.45; }
  }
  #binLid{
    transform-box: view-box;
    transform-origin: 66px 96px;
  }
  .trash-svg.urgent #binLid{
    animation: lid-wiggle 1.1s ease-in-out infinite;
  }
  @keyframes lid-wiggle{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(-16deg); }
  }

  .header-text{ min-width:0; }
  .days-label{
    font-size:22px;
    font-weight:500;
  }
  .days-label.urgent{ color:var(--warn); }
  .date-text{
    margin-top:2px;
    font-size:14px;
    color:var(--muted);
  }
  .offline-note{
    margin-top:4px;
    font-size:12px;
    color:var(--error);
    display:flex;
    align-items:center;
    gap:5px;
  }

  /* ---------------- CHIPS ---------------- */
  .chip-row{
    margin-top:12px;
    display:flex;
    flex-wrap:wrap;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    padding:5px 10px;
    border-radius:14px;
    margin:4px 6px 0 0;
    background: color-mix(in srgb, var(--chip-color, var(--idle)) 18%, transparent);
    color: var(--chip-color, var(--muted));
    border:1px solid color-mix(in srgb, var(--chip-color, var(--idle)) 45%, transparent);
  }
  .chip.chip-empty{
    color:var(--muted);
    border-color:rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.04);
  }

  /* ---------------- ZWEITE ABHOLUNG (DANACH) ---------------- */
  .divider{
    margin:18px 0 14px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .section-label{
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .section-date{
    margin-top:4px;
    font-size:15px;
  }
</style>
</head>
<body>
<main class="trash-card">

  <div class="header">
    <svg id="trashSvg" class="trash-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <ellipse id="binGlow" cx="110" cy="200" rx="70" ry="16"/>
      <!-- Rollen -->
      <circle cx="85" cy="196" r="10" fill="#2b2f36"/>
      <circle cx="155" cy="196" r="10" fill="#2b2f36"/>
      <!-- Tonnenkoerper -->
      <rect x="70" y="90" width="80" height="102" rx="10" fill="#cfd3d8" stroke="#aeb4ba" stroke-width="2"/>
      <!-- Griff-Vertiefung -->
      <rect x="95" y="150" width="30" height="10" rx="5" fill="#aeb4ba"/>
      <!-- Deckel (Farbe je nach Muelltyp, wackelt wenn dringend) -->
      <g id="binLid">
        <rect x="64" y="70" width="92" height="26" rx="10" fill="#9aa2ab"/>
        <rect x="100" y="66" width="20" height="8" rx="3" fill="#7d848c"/>
      </g>
    </svg>

    <div class="header-text">
      <div class="days-label" id="daysLabel">–</div>
      <div class="date-text" id="dateText"></div>
      <div class="offline-note" id="offlineNote" style="display:none">
        <i class="fa-solid fa-plug-circle-xmark"></i> Keine Verbindung
      </div>
    </div>
  </div>

  <div class="chip-row" id="chipsNext"></div>

  <div class="divider"></div>
  <div class="section-label">Danach</div>
  <div class="section-date" id="dateText2">–</div>
  <div class="chip-row" id="chipsAfter"></div>

</main>

<script>
/* ======================================================
   MUELLTONNEN-WIDGET
   Erwartete URL-Parameter:
   ?days=...     (next.daysLeft)
   &date=...     (next.dateFormat)
   &types=...    (next.typesText, Komma-getrennt)
   &found=...    (next.dateFound, true/false)
   &days2=...    (nextAfter.daysLeft)
   &date2=...    (nextAfter.dateFormat)
   &types2=...   (nextAfter.typesText)
   &found2=...   (nextAfter.dateFound)
   &connected=...(info.connection)

   Ohne Parameter laufen sinnvolle Dummy-Daten zum Testen.
====================================================== */
const p = new URLSearchParams(location.search);

function str(val, def){
  if (!val || typeof val !== "string") return def;
  return val.trim() || def;
}
function num(val, def){
  if (val === null || val === undefined || val === "" || val === "null") return def;
  const n = Number(val);
  return Number.isNaN(n) ? def : n;
}
function bool(val, def){
  if (val === null || val === undefined || val === "") return def;
  return String(val).toLowerCase() === "true";
}

const daysNext   = num(p.get("days"), 2);
const dateNext   = str(p.get("date"), "Do, 04.09.2026");
const typesNext  = str(p.get("types"), "Biotonne, Papiertonne");
const foundNext  = bool(p.get("found"), true);

const daysAfter  = num(p.get("days2"), 9);
const dateAfter  = str(p.get("date2"), "Do, 11.09.2026");
const typesAfter = str(p.get("types2"), "Restabfalltonne");
const foundAfter = bool(p.get("found2"), true);

const connected  = bool(p.get("connected"), true);

/* ===============================
   MUELLTYP -> FARBE/ICON
================================ */
const BIN_TYPES = [
  { test:/bio/,                         color:"#57d38c", icon:"fa-leaf" },
  { test:/papier/,                      color:"#4da3ff", icon:"fa-file" },
  { test:/plastik|gelb|verpack/,        color:"#f5c542", icon:"fa-recycle" },
  { test:/glas/,                        color:"#7fd9c4", icon:"fa-wine-bottle" },
  { test:/sperr/,                       color:"#ff9f43", icon:"fa-couch" },
  { test:/rest/,                        color:"#9aa2ab", icon:"fa-trash" }
];
function classifyBin(name){
  const t = name.toLowerCase();
  const hit = BIN_TYPES.find(b => b.test.test(t));
  return hit ? { color:hit.color, icon:hit.icon, label:name } : { color:"#9aa2ab", icon:"fa-trash-can", label:name };
}
function parseTypes(typesText){
  if (!typesText) return [];
  return typesText
    .split(/[,;/]|\sund\s/i)
    .map(s => s.trim())
    .filter(Boolean)
    .map(classifyBin);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function renderChips(container, typesText){
  container.innerHTML = "";
  const bins = parseTypes(typesText);
  if (bins.length === 0) {
    const span = document.createElement("span");
    span.className = "chip chip-empty";
    span.textContent = "Keine Daten";
    container.appendChild(span);
    return bins;
  }
  bins.forEach(b => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.style.setProperty("--chip-color", b.color);
    chip.innerHTML = `<i class="fa-solid ${b.icon}"></i> ${escapeHtml(b.label)}`;
    container.appendChild(chip);
  });
  return bins;
}

function daysLabel(d, found){
  if (!found || d === null) return "Keine Daten";
  if (d <= 0) return "Heute";
  if (d === 1) return "Morgen";
  return `In ${d} Tagen`;
}

/* ===============================
   HEADER (naechste Abholung)
================================ */
const daysLabelEl = document.getElementById("daysLabel");
daysLabelEl.textContent = daysLabel(daysNext, foundNext);

const urgent = foundNext && daysNext !== null && daysNext <= 0;
const soon = foundNext && daysNext === 1;
if (urgent) daysLabelEl.classList.add("urgent");

document.getElementById("dateText").textContent = foundNext ? dateNext : "";

if (!connected) {
  document.getElementById("offlineNote").style.display = "";
}

const nextBins = renderChips(document.getElementById("chipsNext"), foundNext ? typesNext : "");

/* Illustration einfaerben + Status setzen */
const trashSvg = document.getElementById("trashSvg");
if (urgent) trashSvg.classList.add("urgent");
else if (soon) trashSvg.classList.add("soon");
const lidColor = nextBins.length > 0 ? nextBins[0].color : "#9aa2ab";
document.querySelector("#binLid rect").setAttribute("fill", lidColor);

/* ===============================
   "DANACH"
================================ */
document.getElementById("dateText2").textContent = foundAfter
  ? `${daysLabel(daysAfter, foundAfter)} · ${dateAfter}`
  : "Keine Daten";
renderChips(document.getElementById("chipsAfter"), foundAfter ? typesAfter : "");
</script>
</body>
</html>
